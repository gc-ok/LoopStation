name: Build Loop Station

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60        # a hung test must not burn the 6 h default
    strategy:
      fail-fast: false         # one OS failing must not cancel the other
      matrix:
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-26           # macOS Tahoe — matches your target OS
            python-version: '3.12' # Ships with newer Tcl/Tk (fixes autorelease pool crash)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node for monitor regression tests
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # ================================================================
    # FFMPEG — LGPL BUILDS ONLY
    # Loop Station only uses ffmpeg for decoding (no x264/x265 needed).
    # We MUST use LGPL builds to legally distribute as proprietary software.
    # ================================================================

    # WINDOWS: Download pre-built LGPL static binary from BtbN
    - name: Download FFmpeg LGPL (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download LGPL build (no x264, no x265, no GPL codecs)
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg-lgpl.zip
        Expand-Archive ffmpeg-lgpl.zip -DestinationPath ffmpeg-lgpl
        
        # Find the extracted folder (name varies by build date)
        $ffDir = Get-ChildItem ffmpeg-lgpl -Directory | Select-Object -First 1
        $binDir = Join-Path $ffDir.FullName "bin"
        
        # Verify it's actually LGPL
        & "$binDir\ffmpeg.exe" -version
        & "$binDir\ffmpeg.exe" -L
        
        # Make available for PyInstaller
        echo "FFMPEG_PATH=$binDir\ffmpeg.exe" >> $env:GITHUB_ENV
        echo "FFPROBE_PATH=$binDir\ffprobe.exe" >> $env:GITHUB_ENV

    # MACOS: Build from source with --disable-gpl (brew's default enables GPL)
    - name: Build FFmpeg LGPL from source (Mac)
      if: runner.os == 'macOS'
      run: |
        # Install build dependencies
        brew install nasm pkg-config
        
        # Clone FFmpeg release branch
        git clone --depth 1 --branch release/7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
        cd ffmpeg-src
        
        # Configure as LGPL — explicitly disable GPL and unneeded features
        # This gives us all built-in decoders (mp3, aac, flac, pcm, vorbis, etc.)
        # without any GPL-licensed codecs (x264, x265, xvid, etc.)
        ./configure \
          --prefix=$GITHUB_WORKSPACE/ffmpeg-lgpl \
          --disable-gpl \
          --disable-doc \
          --disable-debug \
          --enable-small \
          --disable-encoders \
          --enable-encoder=pcm_s16le \
          --disable-muxers \
          --enable-muxer=s16le,pcm_s16le,null,wav \
          --disable-devices \
          --disable-filters \
          --enable-filter=aresample,anull,atempo,asetrate \
          --disable-bsfs \
          --disable-protocols \
          --enable-protocol=file,pipe \
          --disable-network
        
        # Build (use all cores)
        make -j$(sysctl -n hw.ncpu)
        make install
        
        # Verify LGPL license
        echo "=== Verifying LGPL license ==="
        $GITHUB_WORKSPACE/ffmpeg-lgpl/bin/ffmpeg -version
        $GITHUB_WORKSPACE/ffmpeg-lgpl/bin/ffmpeg -L
        
        # Verify the binary can decode audio (quick sanity check)
        echo "=== Build complete ==="
        
        echo "FFMPEG_PATH=$GITHUB_WORKSPACE/ffmpeg-lgpl/bin/ffmpeg" >> $GITHUB_ENV
        echo "FFPROBE_PATH=$GITHUB_WORKSPACE/ffmpeg-lgpl/bin/ffprobe" >> $GITHUB_ENV

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt pyinstaller pytest pytest-timeout pyflakes

    - name: Lint and test
      shell: bash
      env:
        SDL_AUDIODRIVER: dummy
        LOOPSTATION_FFMPEG: ${{ env.FFMPEG_PATH }}
      run: |
        python -c "import os, subprocess; subprocess.run([os.environ['LOOPSTATION_FFMPEG'], '-hide_banner', '-filters'], check=True)"
        python -m pyflakes backend frontend utils main.py config.py
        # -v names each test as it runs; a test stuck for 5 min dumps every
        # thread's stack and fails instead of hanging the job.
        python -m pytest tests -v --timeout=300 --timeout-method=thread

    # BUILD WINDOWS (bundles LGPL ffmpeg + ffprobe)
    - name: Build Windows .exe
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --name "LoopStation" --icon=logo.ico `
          --osx-bundle-identifier "com.loopstation.app" `
          --paths . `
          --collect-all customtkinter `
          --collect-all matplotlib `
          --collect-all sounddevice `
          --collect-all tkinterdnd2 `
          --hidden-import rtmidi `
          --hidden-import mido.backends.rtmidi `
          --hidden-import pygame `
          --hidden-import pygame.midi `
          --hidden-import mido `
          --hidden-import mido.backends.pygame `
          --hidden-import pythonosc `
          --hidden-import PIL `
          --hidden-import tkinter `
          --hidden-import _tkinter `
          --hidden-import flask `
          --hidden-import werkzeug `
          --hidden-import qrcode `
          --add-data "frontend;frontend" `
          --add-data "backend;backend" `
          --add-data "utils;utils" `
          --add-data "logo.png;." `
          --add-data "logo.ico;." `
          --add-data "THIRD_PARTY_LICENSES.txt;." `
          --add-binary "$env:FFMPEG_PATH;." `
          --add-binary "$env:FFPROBE_PATH;." `
          main.py

    # BUILD MAC (bundles LGPL ffmpeg + ffprobe)
    - name: Build Mac .app
      if: runner.os == 'macOS'
      env:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
      run: |
        pyinstaller --noconsole --name "LoopStation" --icon=logo.png \
          --osx-bundle-identifier "com.loopstation.app" \
          --paths . \
          --collect-all customtkinter \
          --collect-all matplotlib \
          --collect-all sounddevice \
          --collect-all tkinterdnd2 \
          --hidden-import rtmidi \
          --hidden-import mido.backends.rtmidi \
          --hidden-import pygame \
          --hidden-import pygame.midi \
          --hidden-import mido \
          --hidden-import mido.backends.pygame \
          --hidden-import pythonosc \
          --hidden-import PIL \
          --hidden-import tkinter \
          --hidden-import _tkinter \
          --hidden-import flask \
          --hidden-import werkzeug \
          --hidden-import qrcode \
          --add-data "frontend:frontend" \
          --add-data "backend:backend" \
          --add-data "utils:utils" \
          --add-data "logo.png:." \
          --add-data "logo.ico:." \
          --add-data "THIRD_PARTY_LICENSES.txt:." \
          --add-binary "$FFMPEG_PATH:." \
          --add-binary "$FFPROBE_PATH:." \
          main.py

    # ================================================================
    # MAC SIGNING + NOTARIZATION
    # With Apple Developer secrets configured the .app is signed with a
    # Developer ID certificate, notarized and stapled, so Gatekeeper opens
    # it without the "unidentified developer" warning. Without the secrets
    # it falls back to the ad-hoc signature (works, but users must
    # right-click > Open the first time).
    #
    # Repository secrets needed for the full path:
    #   MACOS_CERT_P12_BASE64   Developer ID Application .p12, base64 encoded
    #   MACOS_CERT_PASSWORD     password of that .p12
    #   APPLE_ID                Apple ID email used for notarization
    #   APPLE_TEAM_ID           10-character team id
    #   APPLE_APP_PASSWORD      app-specific password for that Apple ID
    # ================================================================
    - name: Sign and notarize (Mac, Developer ID)
      if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: |
        set -e
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
        security create-keychain -p ci-build build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p ci-build build.keychain
        security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain
        IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
        echo "Signing with: $IDENTITY"

        # Entitlements PyInstaller apps need under the hardened runtime
        cat > entitlements.plist <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          <key>com.apple.security.cs.disable-library-validation</key><true/>
          <key>com.apple.security.device.audio-input</key><true/>
        </dict></plist>
        EOF

        codesign --deep --force --options runtime --timestamp \
          --entitlements entitlements.plist --sign "$IDENTITY" dist/LoopStation.app
        codesign --verify --deep --strict --verbose=2 dist/LoopStation.app

        ditto -c -k --keepParent dist/LoopStation.app LoopStation.zip
        xcrun notarytool submit LoopStation.zip \
          --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
        xcrun stapler staple dist/LoopStation.app
        spctl --assess --type execute --verbose=2 dist/LoopStation.app

    - name: Ad-hoc Code Sign (Mac, no Developer ID secrets)
      if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 == ''
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      run: |
        codesign --deep --force --sign - dist/LoopStation.app
        echo "::notice::Ad-hoc signed only. Add the MACOS_CERT_* / APPLE_* secrets to notarize."

    # UPLOAD RESULT
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LoopStation-${{ runner.os }}
        path: dist/
